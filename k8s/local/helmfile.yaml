repositories:
  - name: groundhog2k
    url: https://groundhog2k.github.io/helm-charts/
  - name: redpanda
    url: https://charts.redpanda.com/

helmDefaults:
  wait: true
  timeout: 300

releases:
  - name: postgres
    namespace: iiot-dev
    chart: groundhog2k/postgres
    version: 1.6.8
    values:
      - values/postgres.yaml

  - name: timescaledb
    namespace: iiot-dev
    chart: groundhog2k/postgres
    version: 1.6.8
    values:
      - values/timescaledb.yaml

  # Local chart (no version pin - the version lives in charts/mosquitto/Chart.yaml)
  - name: mosquitto
    namespace: iiot-dev
    chart: ./charts/mosquitto

  # Redpanda starts more slowly than the other releases, so it gets a longer timeout.
  - name: redpanda
    namespace: iiot-dev
    chart: redpanda/redpanda
    version: 26.2.4
    timeout: 600
    values:
      - values/redpanda.yaml

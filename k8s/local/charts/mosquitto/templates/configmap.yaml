apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  mosquitto.conf: |
    listener 1883
    listener 9001
    protocol websockets

    persistence true
    persistence_location /mosquitto/data/

    log_dest stdout
    log_type error
    log_type warning
    log_type notice
    log_type information

    # Anonymous access: the broker is only reachable inside the cluster.
    # To require authentication, add a password_file and set allow_anonymous to false.
    allow_anonymous true
